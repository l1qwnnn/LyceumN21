<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyceum N21 — Житомирський міський ліцей №21</title>
<meta name="theme-color" content="#050505">
<meta name="description" content="Lyceum N21 — інформаційний портал Житомирського міського ліцею №21: історія ліцею, учням, вчителі, розклад, новини, меню їдальні, контакти та електронний щоденник з оцінками.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23050505'/%3E%3Cpath d='M2.5 8.5 12 4.5l9.5 4-9.5 4-9.5-4Z' fill='none' stroke='%23fff' stroke-width='1.6'/%3E%3Ctext x='16' y='25' font-size='10' fill='%23fff' text-anchor='middle' font-family='Segoe UI'%3E21%3C/text%3E%3C/svg%3E">
<style>
/* Lyceum N21 — стилі перенесено з початкового сайту (public/css/style.css):
   темна тема #050505, плаваючий pill-навбар, скляні картки, pill-кнопки,
   бігучий рядок, auth-cloud, сітка dashboard, stat-chip, admin-table. */
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
body { min-height: 100vh; background: #050505; color: #fff; overflow-x: hidden; }
a { color: inherit; }
:root { color-scheme: dark; }
select, input, textarea, button { color-scheme: inherit; }
select option { background: #151515; color: #fff; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
a, button, input, select, textarea, label, [role="button"] { touch-action: manipulation; }

:where(a, button, input, select, textarea, summary, [tabindex]):focus { outline: none; }
:where(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline: 2px solid #8fc7ea; outline-offset: 2px; }

/* ФОН: суцільний чорний #050505, анімований шар прибрано */
.page, footer { position: relative; z-index: 1; }

/* NAVBAR — floating pill, centered, detached from top */
.navbar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: min(1080px, calc(100% - 64px)); z-index: 700; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 22px; background: rgba(18,18,18,.78); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.16); border-radius: 22px; box-shadow: 0 10px 32px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06) inset; flex-wrap: nowrap; }
.nav-logo { font-size: 1.35rem; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 9px; }
.nav-logo svg { width: 26px; height: 26px; flex: 0 0 auto; }
.nav-right { display: flex; align-items: center; gap: 12px; flex-wrap: nowrap; min-width: 0; }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link { padding: 8px 12px; border-radius: 999px; text-decoration: none; font-size: .88rem; font-weight: 600; white-space: nowrap; opacity: .8; transition: background .2s ease, opacity .2s ease, transform .18s cubic-bezier(.22,1,.36,1); }
.nav-link:hover { background: rgba(255,255,255,.1); opacity: 1; transform: translateY(-1px); }
.nav-link.active { background: #fff; color: #111; opacity: 1; }
.nav-user { display: flex; align-items: center; gap: 10px; }
.btn-nav-auth, .btn-nav-profile { padding: 8px 18px; background: #fff; color: #111; border: none; border-radius: 20px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; height: 42px; white-space: nowrap; }
.btn-nav-profile .nav-username { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: #ffb020; color: #2a1a00; font-size: .68rem; font-weight: 800; line-height: 1; }
.btn-logout { padding: 6px 16px; background: rgba(200,60,60,.85); color: #fff; border: none; border-radius: 15px; cursor: pointer; }

/* button micro-animations */
.btn-dark, .btn-nav-auth, .btn-nav-profile, .btn-auth, .btn-buy, .dashboard-button, .abtn { transition: transform .18s cubic-bezier(.22,1,.36,1), box-shadow .2s ease, background .2s ease, border-color .2s, opacity .2s; will-change: transform; }
.btn-dark:hover, .btn-nav-auth:hover, .btn-nav-profile:hover { transform: translateY(-1px) scale(1.015); }
.btn-dark:active, .btn-nav-auth:active { transform: scale(.96); }

/* PAGES */
.page { padding-top: 92px; }
.hero { padding: 120px 20px 60px; text-align: center; }
.hero-tight { padding: 90px 20px 30px; }
.hero h1 { font-size: 4rem; margin-bottom: 15px; }
.hero p { font-size: 1.3rem; opacity: .9; }
.hero-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 30px; }
.promo-showcase { padding: 30px 20px; text-align: center; }
.promo-showcase h2 { max-width: 900px; margin: 0 auto; font-size: 1.4rem; line-height: 1.4; }

.btn-dark { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #111111; color: #ffffff; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 10px 24px; min-height: 42px; font-weight: 700; font-size: .95rem; cursor: pointer; text-decoration: none; transition: background .2s ease, transform .2s ease, box-shadow .2s ease; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
.btn-dark:hover { background: #222222; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.45); }
.btn-buy { display: inline-block; padding: 12px 30px; background: #fff; color: #000; border: none; border-radius: 25px; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn-ico { flex-shrink: 0; }
.ic { flex: 0 0 auto; width: 18px; height: 18px; vertical-align: -.28em; }
.ic-sm { width: 14px; height: 14px; }
.ic-lg { width: 22px; height: 22px; }

/* Навігатор за інформацією на головній */
.nav-panel { width: min(1200px, calc(100% - 40px)); margin: 26px auto 0; padding: 22px; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; background: rgba(5,5,5,.72); backdrop-filter: blur(14px); text-align: left; }
.nav-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.nav-panel-head h3 { display: flex; align-items: center; gap: 9px; font-size: 1.15rem; }
.cg-search { min-width: 240px; flex: 1 1 240px; max-width: 340px; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: #1e1e1e; color: #fff; font-size: 13px; transition: border-color .18s, background .18s; }
.cg-search::placeholder { color: rgba(255,255,255,.45); }
.cg-search:focus { border-color: rgba(255,255,255,.28); background: #222; }
.cards { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; }
.card { position: relative; z-index: 1; flex: 1 1 240px; min-width: 220px; max-width: 300px; transition: transform .22s cubic-bezier(.22,1,.36,1); will-change: transform; cursor: pointer; }
.card:hover { transform: translateY(-6px); }
.card-cloud { height: 100%; background: #000; border: 1px solid rgba(255,255,255,.3); border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 10px; transition: border-color .32s cubic-bezier(.22,1,.36,1), box-shadow .32s; }
.card-cloud:hover { border-color: rgba(143,199,234,.65); box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.card-cloud .card-ico { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 14px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); }
.card-cloud h3 { font-size: 1.08rem; }
.card-cloud p { opacity: .8; margin-bottom: 0; font-size: .85rem; line-height: 1.45; }
.card-cloud .card-go { margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 700; opacity: .8; }
.card-note { padding: 22px 20px; border: 1px dashed rgba(255,255,255,.22); border-radius: 24px; text-align: center; opacity: .7; font-size: .9rem; }
.keys-filter-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 0 0 18px; }
.filter-tabs { display: inline-flex; background: rgba(0,0,0,.35); padding: 4px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12); gap: 4px; flex-wrap: wrap; }
.ftab { background: none; border: none; color: rgba(255,255,255,.7); padding: 7px 15px; border-radius: 10px; font-size: .82rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .2s; }
.ftab:hover { color: #fff; background: rgba(255,255,255,.06); }
.ftab.active { color: #fff; background: rgba(255,255,255,.16); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.ftab-count { font-size: .75rem; opacity: .75; font-weight: 500; }

/* Бігучий рядок новин */
.reviews-box { position: relative; z-index: 1; width: min(1200px, calc(100% - 40px)); margin: 34px auto 0; padding: 18px 0; border: 1px solid rgba(255,255,255,.16); border-radius: 22px; background: rgba(5,5,5,.72); backdrop-filter: blur(14px); overflow: hidden; }
.reviews-box-head { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px 10px; font-weight: 700; font-size: .95rem; opacity: .9; }
.reviews-viewport { position: relative; overflow: hidden; height: 128px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.reviews-track { position: absolute; left: 0; top: 4px; display: flex; gap: 14px; width: max-content; will-change: transform; }
.reviews-track .review-card { width: var(--card-w, 320px); flex: 0 0 auto; }
.review-card { height: 100%; padding: 14px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; background: rgba(255,255,255,.05); }
.review-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.review-nick { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: .85rem; font-weight: 700; }
.review-date { font-size: .74rem; opacity: .55; white-space: nowrap; }
.review-text { margin: 0; font-size: .85rem; line-height: 1.45; opacity: .9; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

/* Стат-чипи */
.admin-stats { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; width: min(1200px, calc(100% - 40px)); margin: 26px auto 0; }
.stat-chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; flex: 1 1 0; min-width: 116px; padding: 14px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; background: rgba(255,255,255,.04); text-align: center; }
.stat-chip b { display: block; font-size: 1.2rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat-chip span { display: block; font-size: .74rem; line-height: 1.25; opacity: .7; }

/* Внутрішні сторінки */
.page-wide { position: relative; z-index: 1; width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 70px; }
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 8px; }
.list-title { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 1.6rem; font-weight: 800; }
.list-sub { margin: 6px 0 18px; font-size: .9rem; opacity: .75; }
.legal-card { background: rgba(0,0,0,.58); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 32px 28px; backdrop-filter: blur(12px); }
.legal-card h1 { font-size: 1.9rem; margin-bottom: 6px; }
.legal-card h2 { font-size: 1.15rem; margin: 22px 0 10px; }
.legal-card h3 { font-size: 1rem; margin: 16px 0 8px; }
.legal-card p, .legal-card li { font-size: 14px; line-height: 1.6; opacity: .9; }
.legal-card ul, .legal-card ol { padding-left: 18px; display: grid; gap: 6px; margin: 8px 0; }
.legal-card a { color: #8fc7ea; text-decoration: underline; }
.legal-updated { opacity: .55; font-size: 13px; margin-bottom: 18px; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-top: 18px; }
.info-card { padding: 20px; border: 1px solid rgba(255,255,255,.14); border-radius: 18px; background: rgba(0,0,0,.5); }
.info-card h3 { display: flex; align-items: center; gap: 8px; font-size: 1rem; margin-bottom: 8px; }
.info-card p, .info-card li { font-size: 13.5px; line-height: 1.55; opacity: .88; }
.info-card ul { padding-left: 16px; display: grid; gap: 5px; margin-top: 6px; }
.info-card .tag { margin-top: 12px; }

/* Хроніка директорів (біографія школи) */
.timeline { position: relative; margin: 22px 0 0; padding-left: 26px; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: rgba(255,255,255,.18); }
.tl-item { position: relative; padding: 14px 16px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,.14); border-radius: 16px; background: rgba(255,255,255,.04); }
.tl-item::before { content: ''; position: absolute; left: -25px; top: 20px; width: 12px; height: 12px; border-radius: 50%; background: #8fc7ea; box-shadow: 0 0 0 4px rgba(143,199,234,.16); }
.tl-years { font-size: .78rem; letter-spacing: .5px; opacity: .65; text-transform: uppercase; }
.tl-name { font-weight: 800; margin: 4px 0 2px; }
.tl-note { font-size: 13px; opacity: .8; }

/* Списки (вчителі, новини, меню) */
.cfg-list { display: flex; flex-direction: column; gap: 8px; }
.cfg-row { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1px solid rgba(255,255,255,.14); border-radius: 14px; background: rgba(255,255,255,.04); transition: border-color .18s ease, background .18s ease; }
.cfg-row:hover { border-color: rgba(255,255,255,.28); background: rgba(255,255,255,.07); }
.cfg-info { flex: 1 1 auto; min-width: 0; }
.cfg-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
.cfg-author { display: inline-flex; align-items: center; gap: 5px; font-size: .9rem; font-weight: 700; }
.cfg-sep { opacity: .35; }
.cfg-title { font-size: .85rem; opacity: .8; }
.cfg-desc { margin-top: 4px; font-size: .8rem; line-height: 1.4; opacity: .7; }
.cfg-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; }
.admin-search { max-width: 300px; width: 100%; height: 38px; padding: 0 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: #101010; color: #fff; font-size: 13px; }
.admin-search:focus { border-color: #4da6db; box-shadow: 0 0 0 3px rgba(77,166,219,.18); }
.pill { display: inline-block; padding: 3px 11px; border-radius: 9px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.pill-free { background: rgba(46,204,113,.15); color: #7bed9f; border: 1px solid rgba(46,204,113,.4); }
.pill-days { background: rgba(77,166,219,.14); color: #8fc7ea; border: 1px solid rgba(77,166,219,.4); }
.pill-audit { background: rgba(124,92,255,.14); color: #bcaeff; border: 1px solid rgba(124,92,255,.4); }
.pill-clean { background: rgba(255,255,255,.07); color: #9aa7b5; border: 1px solid rgba(255,255,255,.14); }
.pill-warn { background: rgba(241,196,15,.13); color: #f5d76e; border: 1px solid rgba(241,196,15,.5); }
.role-badge { display: inline-block; vertical-align: middle; margin-right: 6px; padding: 2px 8px; border-radius: 8px; font-size: .68rem; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; line-height: 1.5; }
.role-owner { background: #b366ff; color: #160826; }
.role-admin { background: #4da6db; color: #06121d; }
.role-curator { background: #ffb020; color: #2a1a00; }
.role-media { background: #2ecc71; color: #062b18; }

/* AUTH */
.auth-wrap { min-height: calc(100vh - 92px); display: flex; align-items: center; justify-content: center; padding: 60px 20px; }
.auth-cloud { background: #000; border: 1px solid rgba(255,255,255,.25); border-radius: 30px; padding: 40px; width: 420px; max-width: 90vw; }
.auth-tabs { position: relative; display: flex; gap: 5px; margin-bottom: 24px; background: #141414; border-radius: 15px; padding: 4px; }
.auth-tab { position: relative; z-index: 1; flex: 1; padding: 10px; border-radius: 12px; text-align: center; text-decoration: none; color: #fff; font-weight: 600; background: transparent; border: 0; cursor: pointer; font-size: .95rem; }
.auth-thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: 0; border-radius: 12px; background: #2b2b2b; box-shadow: 0 2px 8px rgba(0,0,0,.4); transition: left .35s cubic-bezier(.22,1,.36,1), width .35s cubic-bezier(.22,1,.36,1); }
.auth-form { display: flex; flex-direction: column; gap: 15px; }
.auth-form input { padding: 14px 18px; border: 1px solid rgba(255,255,255,.35); border-radius: 15px; background: #000; color: #fff; }
.auth-field { display: flex; flex-direction: column; gap: 6px; }
.auth-field label { font-size: .78rem; opacity: .75; text-align: left; }
.auth-field-hint { opacity: .6; }
.auth-error { color: #ff7b7b; min-height: 20px; font-size: 13px; text-align: left; }
.btn-auth { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; background: #111111; color: #ffffff; border: 1px solid rgba(255,255,255,.22); border-radius: 999px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: background .2s ease, transform .2s ease; }
.btn-auth:hover { background: #222222; transform: translateY(-2px); }
.auth-hint { margin-top: 14px; font-size: 12px; opacity: .6; line-height: 1.45; }

/* КАБІНЕТ УЧНЯ (оцінки) */
.dashboard { display: grid; grid-template-columns: 300px 1fr 380px; gap: 24px; width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: 30px 0 70px; }
.dashboard-heading { grid-column: 1 / -1; padding: 16px 18px; border: 1px solid rgba(255,255,255,.16); border-radius: 16px; background: rgba(5,5,5,.72); }
.dashboard-kicker { opacity: .7; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.dashboard-title { font-size: 28px; }
.dashboard-subtitle { opacity: .7; font-size: 14px; margin-top: 8px; }
.dashboard-card { border: 1px solid rgba(255,255,255,.16); border-radius: 16px; background: rgba(5,5,5,.72); padding: 16px; }
.dashboard-card h2 { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; opacity: .85; }
.dashboard-card h2 span { min-width: 0; }
.dashboard-card p { opacity: .7; font-size: 13px; margin-top: 6px; }
.dashboard-side { display: flex; flex-direction: column; gap: 16px; grid-column: 1; grid-row: span 2; }
.dashboard-main { grid-column: 2; display: flex; flex-direction: column; gap: 16px; }
.summary-row { grid-column: 2 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.summary-value { margin-top: 8px; font-size: 15px; }
.homework-card { grid-column: 3; align-self: start; }
.account-head { display: flex; gap: 10px; align-items: center; }
.account-avatar { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(140deg,#888,#222); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: #050505; }
.account-copy strong { display: block; font-size: 14px; }
.account-copy span { opacity: .75; font-size: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
.dashboard-button { min-height: 36px; border: 0; border-radius: 11px; background: #fff; color: #111; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; padding: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-link { text-decoration: none; }
.abtn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 999px; border: 1px solid transparent; font-size: 12.5px; font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap; }
.abtn:hover { transform: translateY(-1px); }
.abtn-sm { padding: 7px 12px; font-size: 12px; }
.abtn-ghost { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.18); color: #dfe6ee; }
.abtn-ghost:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.35); color: #fff; }
.table-wrap { overflow-x: auto; margin-top: 12px; border: 1px solid rgba(255,255,255,.15); border-radius: 16px; }
.admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.admin-table th, .admin-table td { border: none; border-bottom: 1px solid rgba(255,255,255,.08); padding: 9px 10px; text-align: left; vertical-align: middle; }
.admin-table thead th { border-bottom: 1px solid rgba(255,255,255,.16); opacity: .75; font-size: .78rem; text-transform: uppercase; letter-spacing: .5px; }
.admin-table tbody tr:last-child td { border-bottom: none; }
.admin-table tbody tr:hover td { background: rgba(255,255,255,.03); }
.admin-table td.num, .admin-table th.num { text-align: center; font-variant-numeric: tabular-nums; }
.mark { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 7px; border-radius: 9px; font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }
.mark-top { background: rgba(46,204,113,.16); color: #7bed9f; border: 1px solid rgba(46,204,113,.45); }
.mark-mid { background: rgba(241,196,15,.14); color: #f5d76e; border: 1px solid rgba(241,196,15,.45); }
.mark-low { background: rgba(231,76,60,.14); color: #ff9d8a; border: 1px solid rgba(231,76,60,.45); }

/* ============================================================
   Lyceum N21 — логіка порталу: маршрутизація, навігатор,
   вхід і реєстрація, електронний щоденник з оцінками.
   Працює як один файл: сервер не потрібен, дані профілю
   залишаються в localStorage цього браузера.
   ============================================================ */

var LS_USERS = 'lyceum21_users';
var LS_SESSION = 'lyceum21_session';
var memoryStore = {};

function lsGet(key) {
  try { return window.localStorage.getItem(key); }
  catch (e) { return memoryStore[key] || null; }
}
function lsSet(key, val) {
  try { window.localStorage.setItem(key, val); }
  catch (e) { memoryStore[key] = val; }
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function ic(name, cls) {
  return '<svg class="ic ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
}
function hash32(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function initials(name) {
  var parts = String(name || '').trim().split(/\s+/);
  return ((parts[0] || 'Л')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function telHref(v) { return String(v || '').replace(/[^+\d]/g, ''); }
function fmtPhone(v) {
  var d = String(v || '').replace(/\D/g, '');
  if (d.indexOf('380') === 0) d = d.slice(2);
  if (d.length === 10 && d.charAt(0) === '0') {
    return '+380 ' + d.slice(1, 3) + ' ' + d.slice(3, 6) + '-' + d.slice(6, 8) + '-' + d.slice(8, 10);
  }
  return String(v || '');
}
function shortTeacher(name) {
  var p = String(name || '').trim().split(/\s+/);
  if (p.length < 2) return String(name || '');
  return p[0] + ' ' + p[1].charAt(0) + '. ' + (p[2] ? p[2].charAt(0) + '.' : '');
}

/* ============================================================
   Клас учня: ліцей навчає паралелі 5—9. Усі оцінки, розклад
   й перелік предметів будуються від класу, а не від 9-го.
   ============================================================ */
var MIN_GRADE = 5;
var MAX_GRADE = 9;
function classGrade(klass) {
  var n = parseInt(String(klass || '').replace(/[^\d]/g, ''), 10);
  if (!n || n < MIN_GRADE) return MIN_GRADE;
  return n > MAX_GRADE ? MAX_GRADE : n;
}
function normClass(raw) {
  var v = String(raw || '').trim().toUpperCase().replace(/\s+/g, '').replace(/[–—]/g, '-');
  var m = v.match(/^(\d{1,2})-?([A-ZА-ЯІЇЄҐ']*)$/);
  if (!m) return null;
  var g = parseInt(m[1], 10);
  if (g < MIN_GRADE || g > MAX_GRADE) return null;
  return g + (m[2] ? '-' + m[2] : '');
}
function subjectOf(name) {
  for (var i = 0; i < SUBJECTS.length; i++) {
    if (SUBJECTS[i].name === name) return SUBJECTS[i];
  }
  return { name: name, teacher: '—', room: '—', icon: 'book' };
}
function classSubjects(klass) {
  var g = classGrade(klass);
  return (GRADE_POOLS[g] || GRADE_POOLS[MAX_GRADE]).map(subjectOf);
}
/* Уроків на день: з 7 класу — повні 7 уроків щодня, 5—6 класи — 6 уроків */
function lessonsPerDay(klass) {
  return classGrade(klass) >= 7 ? BELL.length : BELL.length - 1;
}
/* Тижневий план: той самий клас — той самий розклад на будь-якому пристрої */
function buildWeek(klass) {
  var r = rng(hash32('week|' + klass));
  var order = classSubjects(klass).slice();
  for (var i = order.length - 1; i > 0; i--) {
    var j = Math.floor(r() * (i + 1));
    var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  var perDay = Math.min(lessonsPerDay(klass), order.length);
  var days = [];
  var k = 0;
  for (var d = 0; d < DAYS.length; d++) {
    var lessons = [];
    for (var s = 0; s < perDay; s++) { lessons.push(order[k % order.length]); k++; }
    days.push({ day: DAYS[d], lessons: lessons });
  }
  return days;
}
function curatorFor(klass) {
  var pool = TEACHERS.filter(function (t) {
    return t.role === 'вчитель' && (t.dept === 'filolog' || t.dept === 'math' || t.dept === 'nature' || t.dept === 'social' || t.dept === 'art');
  });
  if (!pool.length) return TEACHERS[0];
  return pool[hash32('curator|' + klass) % pool.length];
}

/* ============================================================
   Оцінки: 12-бальна шкала. Бали стабільні для конкретного
   учня (генеруються з його ПІБ і телефону) і змінюються
   кнопкою «Оновити оцінки».
   ============================================================ */
function buildMarks(user) {
  var g = classGrade(user.klass);
  var r = rng(hash32(user.fullName + '|' + user.phone + '|' + (user.salt || 0)));
  var rows = [];
  var sum = 0;
  classSubjects(user.klass).forEach(function (sub) {
    var count = 4 + Math.floor(r() * 5);
    var current = [];
    var acc = 0;
    for (var i = 0; i < count; i++) {
      var p = r();
      var m = p > 0.74 ? 12 : p > 0.46 ? 11 : p > 0.2 ? 10 : p > 0.09 ? 9 : 8;
      if (p < 0.02) m = 7;
      current.push(m);
      acc += m;
    }
    var avg = acc / current.length;
    var sem1 = Math.max(6, Math.min(12, Math.round(avg - r() * 0.6)));
    var sem2 = Math.max(6, Math.min(12, Math.round(avg + r() * 0.8)));
    var year = Math.max(6, Math.min(12, Math.round((sem1 + sem2) / 2)));
    sum += year;
    rows.push({ name: sub.name, teacher: sub.teacher, sem1: sem1, sem2: sem2, year: year, current: current });
  });
  var average = Math.round((sum / rows.length) * 100) / 100;
  var daysTotal = g >= 7 ? 140 : 120;
  var missed = Math.floor(r() * 9);
  var att = ATTEST[g] || null;
  var attestRows = [];
  if (att) {
    att.subjects.forEach(function (name) {
      var row = rows.filter(function (x) { return x.name === name; })[0];
      if (row) attestRows.push(row);
    });
  }
  return {
    rows: rows,
    grade: g,
    average: average,
    attendance: Math.round(((daysTotal - missed) / daysTotal) * 1000) / 10,
    missed: missed,
    daysTotal: daysTotal,
    best: rows.slice().sort(function (a, b) { return b.year - a.year; })[0],
    att: att,
    attest: attestRows
  };
}

function teachersPage() {
  var list = TEACHERS.filter(function (t) {
    if (teacherFilter !== 'all' && t.dept !== teacherFilter) return false;
    if (!teacherQuery) return true;
    var q = teacherQuery.toLowerCase();
    return (t.name + ' ' + t.subject + ' ' + t.role + ' ' + t.phone).toLowerCase().indexOf(q) > -1;
  });
  var chips = TEACHER_DEPTS.map(function (d) {
    var n = d.id === 'all' ? TEACHERS.length : TEACHERS.filter(function (t) { return t.dept === d.id; }).length;
    return '<button class="ftab' + (teacherFilter === d.id ? ' active' : '') + '" type="button" data-teacher-filter="' + d.id + '">' +
      d.label + '<span class="ftab-count">' + n + '</span></button>';
  }).join('');
  var badgeOf = function (t) {
    if (t.role === 'директор ліцею') return '<span class="role-badge role-owner">Директор</span>';
    if (t.role.indexOf('заступник') === 0) return '<span class="role-badge role-admin">Адміністрація</span>';
    if (t.role.indexOf('психолог') > -1 || t.role.indexOf('педагог') > -1) return '<span class="role-badge role-curator">Фахівець</span>';
    if (t.role.indexOf('бібліотекар') > -1) return '<span class="role-badge role-media">Медіатека</span>';
    return '';
  };
  var rows = list.map(function (t) {
    return '<div class="cfg-row"><div class="cfg-info"><div class="cfg-top">' +
      '<span class="cfg-author">' + badgeOf(t) + esc(t.name) + '</span><span class="cfg-sep">·</span>' +

      '<div class="cfg-actions"><span class="pill pill-clean">' + esc(t.room) + '</span>' +

      '<span>' + esc(t.phone) + '</span></a></div></div>';
  }).join('');
  var admin = TEACHERS.filter(function (t) { return t.dept === 'admin'; });

  return '<section class="page-wide">' +
    '<div class="list-head"><h2 class="list-title">' + ic('users') + '<span>Вчителі та працівники</span></h2>' +
    '<input class="admin-search" id="teacherSearch" type="search" placeholder="Пошук: ім’я, предмет, номер…" value="' + esc(teacherQuery) + '" aria-label="Пошук за педагогами"></div>' +

    '<div class="keys-filter-bar"><div class="filter-tabs">' + chips + '</div>' +
    '<span class="small muted">Знайдено: ' + list.length + '</span></div>' +
    (rows ? '<div class="cfg-list">' + rows + '</div>'
      : '<div class="card-note">Нічого не знайдено. Спробуйте «англійська», «алгебра» або прізвище.</div>') +

    '<div id="admin" class="legal-card" style="margin-top:22px"><h2>Адміністрація ліцею</h2>' +
    '<div class="table-wrap"><table class="admin-table"><thead><tr><th>ПІБ</th><th>Посада</th><th>Предмет</th>' +
    '<th>Категорія</th><th class="num">Кабінет</th><th>Телефон</th></tr></thead><tbody>' +

/* ============================================================
   Розклад: дзвінки + тижневий план вибраного класу
   ============================================================ */
function scheduleClasses() {
  var user = currentUser();
  var list = CLASSES.slice();
  if (user && user.klass && list.indexOf(user.klass) < 0) list.unshift(user.klass);
  return list;
}
function activeScheduleClass() {
  var list = scheduleClasses();
  var user = currentUser();
  if (scheduleClass && list.indexOf(scheduleClass) > -1) return scheduleClass;
  if (user && user.klass && list.indexOf(user.klass) > -1) return user.klass;
  return '9-А';
}
function schedulePage() {
  var klass = activeScheduleClass();
  var chips = scheduleClasses().map(function (c) {
    return '<button class="ftab' + (c === klass ? ' active' : '') + '" type="button" data-class-chip="' + esc(c) + '">' + esc(c) + '</button>';
  }).join('');
  var bells = BELL.map(function (b) {
    return '<tr><td class="num">' + b.n + '</td><td><b>' + b.start + ' — ' + b.end + '</b></td>' +
      '<td class="muted small">' + esc(b.note || 'перерва 10 хвилин') + '</td></tr>';
  }).join('');
  var curator = curatorFor(klass);
  var week = buildWeek(klass).map(function (d) {
    return '<article class="info-card"><h3>' + ic('calendar', 'ic-sm') + '<span>' + esc(d.day) + '</span></h3>' +
      '<div class="cfg-list" style="margin-top:10px">' +
      d.lessons.map(function (l, i) {
        return '<div class="cfg-row"><div class="cfg-info"><div class="cfg-top">' +
          '<span class="cfg-author">' + (i + 1) + '. ' + esc(l.name) + '</span><span class="cfg-sep">·</span>' +
          '<span class="cfg-title">' + esc(shortTeacher(l.teacher)) + '</span></div>' +
          '<div class="cfg-desc">' + BELL[i].start + ' — ' + BELL[i].end + ' · ' + esc(l.room) + '</div></div></div>';
      }).join('') + '</div></article>';
  }).join('');
  return '<section class="page-wide">' +
    '<div class="list-head"><h2 class="list-title">' + ic('clock') + '<span>Розклад</span></h2>' +
    '<a class="abtn abtn-ghost abtn-sm" href="#/profile">' + ic('star', 'ic-sm') + '<span>Мої оцінки</span></a></div>' +
    '<p class="list-sub">Розклад дзвонів і тижневий навчальний план для вибраного класу (' + esc(klass) +
    ' · ' + lessonsPerDay(klass) + ' уроків щодня). ' +
    'Класний керівник — ' + esc(curator.name) + ' (' + esc(curator.room) + ', ' + esc(curator.phone) + ').</p>' +
    '<div class="keys-filter-bar"><div class="filter-tabs">' + chips + '</div>' +
    '<span class="small muted">' + (currentUser() ? 'Ваш клас вибрано автоматично' : 'Виберіть клас зі списку') + '</span></div>' +
    '<div class="legal-card"><h2>Розклад дзвонів</h2>' +
    '<div class="table-wrap"><table class="admin-table"><thead><tr><th class="num">Урок</th><th>Час</th><th>Примітка</th></tr></thead>' +
    '<tbody>' + bells + '</tbody></table></div>' +
    '<p class="small muted" style="margin-top:12px">' + esc(SCHOOL.hours) + ' · ' + esc(SCHOOL.reception) + '</p></div>' +
    '<h2 class="list-title" style="margin:22px 0 6px;font-size:1.25rem">' + ic('calendar') + '<span>Навчальний план ' + esc(klass) + ' класу</span></h2>' +

/* ============================================================
   Домашні завдання: будуються від класу учня
   ============================================================ */
var HOMEWORK_TASKS = [
  'підручник §{n} — конспект і переказ',
  'практична робота №{n}, оформити висновки',
  'вправа {n} та картка для повторення',
  'самостійна робота на платформі ' + SCHOOL.platform,
  'проєктна робота в парі — презентація до теми {n}',
  'алгоритм опрацювати, тренажер №{n}'
];
var HOMEWORK_PILLS = ['pill-days', 'pill-free', 'pill-audit', 'pill-clean', 'pill-warn'];
function homeworkList(user) {
  var list = classSubjects(user.klass);
  var r = rng(hash32('hw|' + user.klass + '|' + user.fullName + '|' + (user.salt || 0)));
  var start = Math.floor(r() * list.length);
  var rows = [];
  for (var i = 0; i < 5 && i < list.length; i++) {
    var sub = list[(start + i) % list.length];
    var n = 5 + Math.floor(r() * 24);
    var text = HOMEWORK_TASKS[Math.floor(r() * HOMEWORK_TASKS.length)].replace(/\{n\}/g, n);
    rows.push([sub.name, text, HOMEWORK_PILLS[i % HOMEWORK_PILLS.length]]);
  }
  return rows;
}

        '<button class="dashboard-button" type="button" data-action="logout" style="background:#c0392b;color:#fff">' +
        ic('logout', 'ic-sm') + '<span>Вийти</span></button></section>' +
    '</aside>' +

    '<section class="summary-row">' +
      '<article class="dashboard-card">' + attCard + '</article>' +
      '<article class="dashboard-card"><h2>' + ic('clock', 'ic-sm') + '<span>Реєстрація</span></h2>' +
        '<div class="summary-value">' + esc(user.created) + '</div>' +
        '<p>Дані профілю зберігаються локально на цьому пристрої.</p></article>' +
      '<article class="dashboard-card"><h2>' + ic('book', 'ic-sm') + '<span>Предмети</span></h2>' +
        '<div class="summary-value">' + g.rows.length + ' дисциплін</div>' +
        '<p>Шкала 12-бальна; річна оцінка = (I + II семестр) / 2.</p></article>' +
    '</section>' +

    '<div class="dashboard-main"><section class="dashboard-card">' +
      '<h2>' + ic('star', 'ic-sm') + '<span>Оцінки з предметів · ' + esc(klass) + ' клас</span></h2>' +
      '<div class="table-wrap"><table class="admin-table"><thead><tr><th>Предмет / вчитель</th><th>Поточні бали</th>' +
      '<th class="num">I семестр</th><th class="num">II семестр</th><th class="num">Річна</th></tr></thead>' +
      '<tbody>' + rowsHtml + '</tbody></table></div>' +
      '<p class="small muted" style="margin-top:12px">Поточні бали виставляє вчитель у журналі ' + esc(SCHOOL.platform) +
      '; тут показано останні оцінки з кожного предмета. Річна оцінка — у правій колонці.</p>' +
    '</section>' +
    '<section class="dashboard-card support-card"><h2>' + ic('phone', 'ic-sm') + '<span>Є запитання?</span></h2>' +
      '<div class="cfg-list" style="margin-top:10px">' +
      [['Класний керівник', shortTeacher(curator.name) + ', ' + curator.room, curator.phone],
       ['Заступник директора з НВР', 'Андрущенко Л. П., каб. 302', '+380 67 241-08-12'],
       ['Практичний психолог', 'Кобасенко І. Ю., каб. 116', '+380 63 508-77-21']]
        .map(function (c) {
          return '<div class="cfg-row"><div class="cfg-info"><div class="cfg-top"><span class="cfg-author">' + esc(c[0]) + '</span>' +
            '<span class="cfg-sep">·</span><span class="cfg-title">' + esc(c[1]) + '</span></div></div>' +
            '<div class="cfg-actions"><a class="abtn abtn-ghost abtn-sm" href="tel:' + esc(telHref(c[2])) + '">' +
            ic('phone', 'ic-sm') + '<span>' + esc(c[2]) + '</span></a></div></div>';
        }).join('') + '</div></section></div>' +

    '<section class="dashboard-card homework-card"><h2>' + ic('bell', 'ic-sm') + '<span>Домашні завдання на сьогодні</span></h2>' +
      '<div class="cfg-list" style="margin-top:10px">' + hw + '</div>' +
      '<div class="requirements" style="margin-top:14px">' +
        '<div><strong>' + ic('trophy', 'ic-sm') + ' Середній</strong><em>' + g.average.toFixed(2) + '</em></div>' +
        '<div><strong>' + ic('check', 'ic-sm') + ' Пропуски</strong><em>' + g.missed + ' уроків</em></div>' +
        '<div><strong>' + ic('shield', 'ic-sm') + ' Рівень</strong><em>' + esc(level.split(' ')[0]) + '</em></div>' +
      '</div>' +
      '<a class="dashboard-button btn-link" href="#/dining">' + ic('bowl', 'ic-sm') + '<span>Меню їдальні</span></a>' +
    '</section></section>';
}

var PAGES = {
  home: homePage, history: historyPage, students: studentsPage, teachers: teachersPage,
  schedule: schedulePage, news: newsPage, dining: diningPage, admissions: admissionsPage,
  contacts: contactsPage, auth: authPage, profile: profilePage
};

/* --- рендер --- */
function render() {
  var state = parseHash();
  document.getElementById('app').innerHTML = PAGES[state.route]();
  renderNav();
  if (state.route === 'home') { startTicker(); bindSearch('navSearch', 'navQuery'); } else { stopTicker(); }
  if (state.route === 'teachers') bindSearch('teacherSearch', 'teacherQuery');
  if (state.route === 'auth') { bindAuth(); moveAuthThumb(); }
  notice = null;
  if (state.anchor) {
    var target = document.getElementById(state.anchor);
    if (target) setTimeout(function () {
      var top = target.getBoundingClientRect().top + window.pageYOffset - 96;
      window.scrollTo({ top: top < 0 ? 0 : top, behavior: 'smooth' });
    }, 60);
  } else {
    window.scrollTo(0, 0);
  }
  document.title = TITLES[state.route] + ' — Lyceum N21 · ' + SCHOOL.full;
}

/* --- бігучий рядок новин --- */
var tickerTimer = null;
function startTicker() {
  var track = document.getElementById('newsTrack');
  if (!track) return;
  var card = function (n) {
    return '<div class="review-card"><div class="review-top"><span class="review-nick">' + ic('news', 'ic-sm') +
      '<b>' + esc(n.title) + '</b></span><span class="review-date">' + esc(n.date) + '</span></div>' +
      '<p class="review-text">' + esc(n.text) + '</p></div>';
  };
  var html = NEWS.map(card).join('');
  track.innerHTML = html + html;
  var w = 344;
  track.style.setProperty('--card-w', w + 'px');
  var total = NEWS.length * w;
  var pos = 0;
  stopTicker();
  tickerTimer = setInterval(function () {
    pos += 0.55;
    if (pos >= total) pos -= total;
    track.style.transform = 'translateX(' + (-pos) + 'px)';
  }, 16);
}
function stopTicker() { if (tickerTimer) { clearInterval(tickerTimer); tickerTimer = null; } }

/* --- поля пошуку (навігатор і вчителі) --- */
function bindSearch(inputId, varName) {
  var input = document.getElementById(inputId);
  if (!input) return;
  input.addEventListener('input', function () {
    if (varName === 'navQuery') navQuery = input.value; else teacherQuery = input.value;
    render();
    var again = document.getElementById(inputId);
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  });
}

/* --- авторизація --- */
function moveAuthThumb() {
  var tabs = document.querySelectorAll('.auth-tab');
  var thumb = document.getElementById('authThumb');
  if (!tabs.length || !thumb) return;
  var active = null;
  Array.prototype.forEach.call(tabs, function (t) { if (t.className.indexOf('active') > -1) active = t; });
  if (!active) return;
  thumb.style.left = active.offsetLeft + 'px';
  thumb.style.width = active.offsetWidth + 'px';
}
function authError(msg) {
  var box = document.getElementById('authError');
  if (box) box.textContent = msg;
}
function bindAuth() {
  var form = document.getElementById('authForm');
  if (!form) return;
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var f = new FormData(form);
    var phone = String(f.get('phone') || '').replace(/[^\d+]/g, '');
    var pass = String(f.get('password') || '');
    var users = loadUsers();
    if (authMode === 'register') {
      var fullName = String(f.get('fullName') || '').trim().replace(/\s+/g, ' ');
      var klass = normClass(f.get('klass'));
      if (fullName.split(' ').length < 2) return authError('Вкажіть ПІБ повністю: прізвище та ім’я, бажано по батькові.');
      if (!klass) return authError('У ліцеї навчаються 5—9 класи. Клас записується цифрою і буквою паралелі, наприклад 5-А або 9-Б.');
      if (!/^(\+380|380|0)\d{9}$/.test(phone)) return authError('Введіть телефон у форматі +380 XXX XXX-XX-XX.');
      if (pass.length < 6 || !/\d/.test(pass) || !/[a-zа-яєіїґ]/i.test(pass)) return authError('Пароль: щонайменше 6 символів, літери й цифри.');
      if (pass !== String(f.get('password2') || '')) return authError('Паролі не збігаються.');
      if (users.some(function (u) { return u.phone === phone; })) return authError('Такий номер уже зареєстровано — увійдіть у профіль.');
      var id = 'u' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36);
      users.push({
        id: id, fullName: fullName, klass: klass, phone: phone, pass: passHash(phone, pass),
        created: new Date().toLocaleString('uk-UA'), salt: 0
      });
      saveUsers(users);
      lsSet(LS_SESSION, id);
      scheduleClass = klass;
      notice = 'Профіль «' + fullName + '» створено — оцінки ' + klass + ' класу вже в щоденнику.';
      location.hash = '#/profile';
    } else {
      var found = users.filter(function (u) { return u.phone === phone; })[0];
      if (!found) return authError('Профіль з таким номером не знайдено — пройдіть реєстрацію.');
      if (found.pass !== passHash(phone, pass)) return authError('Невірний пароль. Спробуйте ще раз.');
      lsSet(LS_SESSION, found.id);
      scheduleClass = found.klass;
      notice = 'Ви увійшли як ' + found.fullName + '.';
      location.hash = '#/profile';
    }
  });
}

/* --- обробники кліків --- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-auth-tab],[data-nav-filter],[data-teacher-filter],[data-class-chip],[data-action]') : null;
  if (!el) return;
  if (el.hasAttribute('data-auth-tab')) { authMode = el.getAttribute('data-auth-tab'); render(); return; }
  if (el.hasAttribute('data-nav-filter')) { navFilter = el.getAttribute('data-nav-filter'); render(); return; }
  if (el.hasAttribute('data-teacher-filter')) { teacherFilter = el.getAttribute('data-teacher-filter'); render(); return; }
  if (el.hasAttribute('data-class-chip')) { scheduleClass = el.getAttribute('data-class-chip'); render(); return; }
  var a = el.getAttribute('data-action');
  if (a === 'logout') {
    lsSet(LS_SESSION, '');
    scheduleClass = '';
    notice = 'Ви вийшли з профілю.';
    if (location.hash === '#/profile') location.hash = '#/home'; else render();
  }
  if (a === 'regenerate') {
    var user = currentUser();
    if (user) {
      saveUsers(loadUsers().map(function (u) {
        if (u.id === user.id) u.salt = (u.salt || 0) + 1;
        return u;
      }));
      notice = 'Оцінки перераховано (демонстраційний режим).';
      render();
    }
  }
});

window.addEventListener('hashchange', render);
window.addEventListener('resize', moveAuthThumb);
render();
</script>
